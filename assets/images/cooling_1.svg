<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="clgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#clgBg)"/>

  <!-- Aluminum Radiator Core -->
  <g transform="translate(60, 45)">
    <!-- Top tank -->
    <rect x="20" y="25" width="240" height="24" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Radiator Cap -->
    <rect x="220" y="14" width="24" height="11" rx="2" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="232" y="22" fill="#0f172a" font-size="6" font-family="sans-serif" font-weight="bold" text-anchor="middle">1.3 BAR</text>
    <!-- Inlet tube -->
    <circle cx="50" cy="20" r="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

    <!-- Fin core -->
    <rect x="25" y="55" width="230" height="130" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Cooling fins pattern lines -->
    <line x1="45" y1="55" x2="45" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="65" y1="55" x2="65" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="85" y1="55" x2="85" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="105" y1="55" x2="105" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="125" y1="55" x2="125" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="145" y1="55" x2="145" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="165" y1="55" x2="165" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="185" y1="55" x2="185" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="205" y1="55" x2="205" y2="185" stroke="#334155" stroke-width="2"/>
    <line x1="225" y1="55" x2="225" y2="185" stroke="#334155" stroke-width="2"/>

    <!-- Dual electric fans mounted -->
    <circle cx="85" cy="120" r="40" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="85" cy="120" r="12" fill="#334155"/>
    <circle cx="195" cy="120" r="40" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="195" cy="120" r="12" fill="#334155"/>

    <!-- Bottom tank -->
    <rect x="20" y="190" width="240" height="24" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Drain petcock & outlet -->
    <circle cx="230" cy="220" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <g transform="translate(260, 20)">
    <rect width="120" height="24" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="16" fill="#67e8f9" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">KOYORAD JDM</text>
  </g>
</svg>
