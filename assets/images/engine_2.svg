<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <radialGradient id="redStudioLighting" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f1124"/>
      <stop offset="60%" stop-color="#0e0a14"/>
      <stop offset="100%" stop-color="#040206"/>
    </radialGradient>
    <radialGradient id="redAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redWrinkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="polishedMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#ef4444" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#redStudioLighting)"/>
  <circle cx="250" cy="170" r="180" fill="url(#redAura)"/>
  <ellipse cx="250" cy="320" rx="200" ry="25" fill="#000000" opacity="0.6"/>

  <g transform="translate(85, 40)" filter="url(#glowRed)">
    <!-- Red Wrinkle Powder Coated Valve Cover -->
    <path d="M 50 40 L 280 40 L 300 85 L 30 85 Z" fill="url(#redWrinkle)" stroke="#fca5a5" stroke-width="2"/>
    <rect x="70" y="50" width="190" height="20" rx="4" fill="#7f1d1d" stroke="#fecaca" stroke-width="1.5"/>
    <text x="165" y="65" fill="#ffffff" font-size="12" font-family="'Outfit', sans-serif" font-weight="900" letter-spacing="3" text-anchor="middle">HONDA i-VTEC DOHC</text>

    <!-- Chrome Oil Cap -->
    <circle cx="270" cy="60" r="10" fill="url(#polishedMetal)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Cylinder Head -->
    <path d="M 35 85 L 295 85 L 290 140 L 40 140 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>

    <!-- Polished Chrome High-Flow Intake Runners -->
    <path d="M 60 95 C 60 135, 20 140, 10 185" fill="none" stroke="url(#polishedMetal)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 115 95 C 115 135, 45 140, 25 190" fill="none" stroke="url(#polishedMetal)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 170 95 C 170 135, 70 140, 42 195" fill="none" stroke="url(#polishedMetal)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 225 95 C 225 135, 95 140, 60 200" fill="none" stroke="url(#polishedMetal)" stroke-width="12" stroke-linecap="round"/>

    <!-- Engine Block -->
    <rect x="50" y="140" width="235" height="100" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Pulleys & Belt Drive -->
    <circle cx="310" cy="110" r="22" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
    <circle cx="300" cy="165" r="18" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="310" cy="220" r="28" fill="#0f172a" stroke="#ef4444" stroke-width="3.5"/>
    <path d="M 310 88 L 310 248 L 290 180 Z" fill="none" stroke="#f59e0b" stroke-width="3.5"/>

    <!-- High-Capacity Baffled Oil Pan -->
    <path d="M 70 240 L 270 240 L 250 270 L 85 270 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(360, 25)">
    <rect width="115" height="28" rx="6" fill="#180c10" stroke="#ef4444" stroke-width="1.8"/>
    <circle cx="16" cy="14" r="5" fill="#ef4444"/>
    <text x="64" y="18" fill="#fca5a5" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">TYPE-R 14.1 BAR</text>
  </g>
</svg>
