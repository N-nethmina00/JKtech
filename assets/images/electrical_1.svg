<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="elcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#elcBg)"/>

  <!-- Alternator & ECU -->
  <g transform="translate(60, 50)">
    <!-- Alternator round housing -->
    <circle cx="100" cy="110" r="65" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="100" cy="110" r="45" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="100" cy="110" r="18" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="100" cy="110" r="7" fill="#020617"/>

    <!-- Cooling slots -->
    <line x1="70" y1="90" x2="60" y2="80" stroke="#38bdf8" stroke-width="3"/>
    <line x1="130" y1="90" x2="140" y2="80" stroke="#38bdf8" stroke-width="3"/>
    <line x1="70" y1="130" x2="60" y2="140" stroke="#38bdf8" stroke-width="3"/>
    <line x1="130" y1="130" x2="140" y2="140" stroke="#38bdf8" stroke-width="3"/>

    <!-- ECU Aluminum Case -->
    <rect x="180" y="60" width="100" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="195" y="45" width="70" height="15" rx="3" fill="#334155" stroke="#10b981" stroke-width="1.5"/>
    <!-- Yellow wire harness pins -->
    <circle cx="210" cy="52" r="2" fill="#fbbf24"/>
    <circle cx="220" cy="52" r="2" fill="#fbbf24"/>
    <circle cx="230" cy="52" r="2" fill="#fbbf24"/>
    <circle cx="240" cy="52" r="2" fill="#fbbf24"/>
    <circle cx="250" cy="52" r="2" fill="#fbbf24"/>

    <text x="230" y="110" fill="#34d399" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">DENSO OEM</text>
    <text x="230" y="130" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">12V 90A REG</text>
  </g>

  <g transform="translate(260, 20)">
    <rect width="120" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="16" fill="#34d399" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">BENCH TESTED</text>
  </g>
</svg>
