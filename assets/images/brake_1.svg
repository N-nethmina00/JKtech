<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <radialGradient id="brakeLighting" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#191d28"/>
      <stop offset="60%" stop-color="#090c14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="amberAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bremboGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="rotorAlloy" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="98%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="brakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#brakeLighting)"/>
  <circle cx="270" cy="180" r="160" fill="url(#amberAura)"/>
  <ellipse cx="270" cy="320" rx="190" ry="20" fill="#000000" opacity="0.6"/>

  <g transform="translate(40, 20)" filter="url(#brakeShadow)">
    <!-- Slotted & Cross-Drilled 326mm Rotor -->
    <g transform="translate(250, 160)">
      <!-- Outer Disc Rim -->
      <circle cx="0" cy="0" r="130" fill="url(#rotorAlloy)" stroke="#94a3b8" stroke-width="4"/>
      <!-- Rotor Friction Surface Grooves -->
      <circle cx="0" cy="0" r="120" fill="none" stroke="#334155" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#334155" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="75" fill="#1e293b" stroke="#475569" stroke-width="3"/>

      <!-- Aluminum Center Bell Hat -->
      <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="#030712"/>

      <!-- 5-Lug Bolt Pattern (5x114.3 / 5x100) -->
      <circle cx="0" cy="-35" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="33" cy="-11" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="21" cy="28" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-21" cy="28" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-33" cy="-11" r="5.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

      <!-- Directional JDM Curved Slots -->
      <path d="M 65 -65 Q 90 -45, 105 -15" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 75 45 Q 55 80, 20 100" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <path d="M -70 50 Q -95 20, -105 -15" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <path d="M -45 -70 Q -20 -95, 15 -105" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

      <!-- Cross-Drilled Holes -->
      <circle cx="75" cy="-25" r="3" fill="#000000"/>
      <circle cx="90" cy="-35" r="3" fill="#000000"/>
      <circle cx="35" cy="75" r="3" fill="#000000"/>
      <circle cx="45" cy="90" r="3" fill="#000000"/>
      <circle cx="-75" cy="25" r="3" fill="#000000"/>
      <circle cx="-90" cy="35" r="3" fill="#000000"/>
      <circle cx="-35" cy="-75" r="3" fill="#000000"/>
      <circle cx="-45" cy="-90" r="3" fill="#000000"/>
    </g>

    <!-- Brembo 4-Pot Monobloc Radial Mount Caliper -->
    <g transform="translate(60, 60)">
      <!-- Main Caliper Cast Body -->
      <path d="M 30 20 C 80 8, 140 8, 175 30 C 190 70, 190 130, 175 170 C 140 190, 80 190, 30 180 C 12 130, 12 70, 30 20 Z" fill="url(#bremboGold)" stroke="#fef08a" stroke-width="2.5"/>
      
      <!-- 4 Opposed Pistons with High-Pressure Dust Seals -->
      <circle cx="70" cy="65" r="20" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
      <circle cx="70" cy="135" r="20" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
      <circle cx="130" cy="65" r="20" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
      <circle cx="130" cy="135" r="20" fill="#0f172a" stroke="#d97706" stroke-width="3"/>

      <!-- Inner Piston Crowns -->
      <circle cx="70" cy="65" r="10" fill="#334155" stroke="#f8fafc" stroke-width="1.5"/>
      <circle cx="70" cy="135" r="10" fill="#334155" stroke="#f8fafc" stroke-width="1.5"/>
      <circle cx="130" cy="65" r="10" fill="#334155" stroke="#f8fafc" stroke-width="1.5"/>
      <circle cx="130" cy="135" r="10" fill="#334155" stroke="#f8fafc" stroke-width="1.5"/>

      <!-- Official brembo Red / White Script -->
      <text x="100" y="105" fill="#ffffff" font-size="16" font-family="'Outfit', sans-serif" font-weight="900" letter-spacing="1.5" text-anchor="middle">brembo</text>
      <!-- Bleeder screw -->
      <polygon points="100,5 106,16 94,16" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="6" fill="#181206" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="16" cy="14" r="5" fill="#f59e0b"/>
    <text x="70" y="18" fill="#fde68a" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">4-POT MONOBLOC</text>
  </g>
</svg>
