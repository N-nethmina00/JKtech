<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <radialGradient id="transLighting" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141c2d"/>
      <stop offset="60%" stop-color="#090e18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="blueAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alloyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="transShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#transLighting)"/>
  <circle cx="250" cy="180" r="170" fill="url(#blueAura)"/>
  <ellipse cx="250" cy="325" rx="190" ry="18" fill="#000000" opacity="0.6"/>

  <g transform="translate(80, 50)" filter="url(#transShadow)">
    <!-- Bellhousing Flange (Left) -->
    <path d="M 40 45 C 80 30, 120 55, 135 85 L 135 220 C 120 250, 80 270, 40 255 C 18 205, 18 95, 40 45 Z" fill="url(#alloyGrad)" stroke="#60a5fa" stroke-width="2.5"/>
    
    <!-- Torque Converter Inside -->
    <ellipse cx="75" cy="150" rx="28" ry="60" fill="#0f172a" stroke="#93c5fd" stroke-width="2.5"/>
    <ellipse cx="75" cy="150" rx="14" ry="32" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="75" cy="150" r="8" fill="#60a5fa"/>

    <!-- Transmission Main Case with Cooling Fins -->
    <rect x="135" y="85" width="165" height="135" rx="10" fill="url(#alloyGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Horizontal Ribs -->
    <line x1="145" y1="105" x2="285" y2="105" stroke="#1e293b" stroke-width="3"/>
    <line x1="145" y1="125" x2="285" y2="125" stroke="#1e293b" stroke-width="3"/>
    <line x1="145" y1="145" x2="285" y2="145" stroke="#1e293b" stroke-width="3"/>
    <line x1="145" y1="165" x2="285" y2="165" stroke="#1e293b" stroke-width="3"/>
    <line x1="145" y1="185" x2="285" y2="185" stroke="#1e293b" stroke-width="3"/>
    <line x1="145" y1="205" x2="285" y2="205" stroke="#1e293b" stroke-width="3"/>

    <!-- Oil Sump Pan -->
    <rect x="150" y="220" width="135" height="25" rx="4" fill="#0b101c" stroke="#475569" stroke-width="2"/>
    <circle cx="265" cy="232" r="4" fill="#f59e0b"/>

    <!-- Extension Housing & Output Tailshaft (Right) -->
    <path d="M 300 115 L 375 130 L 375 170 L 300 185 Z" fill="url(#alloyGrad)" stroke="#64748b" stroke-width="2"/>
    <rect x="375" y="140" width="30" height="20" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

    <!-- Shift Solenoid Wire Connector Block -->
    <rect x="180" y="55" width="40" height="30" rx="5" fill="#0a101f" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="195" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="210" cy="70" r="4" fill="#38bdf8"/>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(360, 25)">
    <rect width="115" height="28" rx="6" fill="#0c1322" stroke="#3b82f6" stroke-width="1.8"/>
    <circle cx="16" cy="14" r="5" fill="#3b82f6"/>
    <text x="64" y="18" fill="#93c5fd" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">PRESSURE OK</text>
  </g>
</svg>
