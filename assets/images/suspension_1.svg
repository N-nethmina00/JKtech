<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <radialGradient id="susLighting" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#11221b"/>
      <stop offset="60%" stop-color="#08100d"/>
      <stop offset="100%" stop-color="#030605"/>
    </radialGradient>
    <radialGradient id="greenAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teinGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldCoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="susShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#susLighting)"/>
  <circle cx="250" cy="180" r="170" fill="url(#greenAura)"/>
  <ellipse cx="250" cy="325" rx="180" ry="18" fill="#000000" opacity="0.6"/>

  <g transform="translate(130, 25)" filter="url(#susShadow)">
    <!-- Damper 1 (Front Assembly) -->
    <g transform="translate(0, 0)">
      <!-- Top Pillowball Camber Mount -->
      <path d="M 25 25 L 85 25 L 75 45 L 35 45 Z" fill="url(#teinGreen)" stroke="#6ee7b7" stroke-width="2"/>
      <circle cx="55" cy="35" r="7" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="55" cy="35" r="3" fill="#10b981"/>

      <!-- Polished Chrome Piston Rod -->
      <rect x="50" y="45" width="10" height="50" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

      <!-- Dust Boot & Bump Stop -->
      <rect x="42" y="80" width="26" height="25" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

      <!-- High-Tensile Gold Coiled Spring -->
      <path d="M 30 100 Q 80 112, 30 125 Q 80 137, 30 150 Q 80 162, 30 175 Q 80 187, 30 200 Q 80 212, 30 225" fill="none" stroke="url(#goldCoil)" stroke-width="13" stroke-linecap="round"/>

      <!-- Threaded Green Steel Damper Body with Height Adjustment Locking Collars -->
      <rect x="45" y="210" width="20" height="85" fill="url(#teinGreen)" stroke="#6ee7b7" stroke-width="1.5"/>
      <!-- Anodized Green Locking Rings -->
      <rect x="35" y="220" width="40" height="8" rx="2" fill="#059669" stroke="#fef08a" stroke-width="1.5"/>
      <rect x="35" y="230" width="40" height="8" rx="2" fill="#059669" stroke="#fef08a" stroke-width="1.5"/>

      <!-- Lower Mounting Bracket / Bushing Eyelet -->
      <circle cx="55" cy="305" r="16" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
      <circle cx="55" cy="305" r="7" fill="#040608"/>
    </g>

    <!-- Damper 2 (Rear Assembly with Offset) -->
    <g transform="translate(130, 15)">
      <path d="M 25 25 L 85 25 L 75 45 L 35 45 Z" fill="url(#teinGreen)" stroke="#6ee7b7" stroke-width="2"/>
      <circle cx="55" cy="35" r="7" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="55" cy="35" r="3" fill="#10b981"/>

      <rect x="50" y="45" width="10" height="50" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="42" y="80" width="26" height="25" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

      <path d="M 30 100 Q 80 112, 30 125 Q 80 137, 30 150 Q 80 162, 30 175 Q 80 187, 30 200 Q 80 212, 30 225" fill="none" stroke="url(#goldCoil)" stroke-width="13" stroke-linecap="round"/>

      <rect x="45" y="210" width="20" height="85" fill="url(#teinGreen)" stroke="#6ee7b7" stroke-width="1.5"/>
      <rect x="35" y="220" width="40" height="8" rx="2" fill="#059669" stroke="#fef08a" stroke-width="1.5"/>
      <rect x="35" y="230" width="40" height="8" rx="2" fill="#059669" stroke="#fef08a" stroke-width="1.5"/>

      <circle cx="55" cy="305" r="16" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
      <circle cx="55" cy="305" r="7" fill="#040608"/>
    </g>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(360, 25)">
    <rect width="115" height="28" rx="6" fill="#09140f" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="16" cy="14" r="5" fill="#10b981"/>
    <text x="64" y="18" fill="#6ee7b7" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">TEIN 16-STAGE</text>
  </g>
</svg>
