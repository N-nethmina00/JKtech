<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Royal Blue Gradient for the "J" -->
    <linearGradient id="emblemBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0091FF"/>
      <stop offset="100%" stop-color="#0B63E5"/>
    </linearGradient>

    <!-- Metallic Platinum Gear Gradient -->
    <linearGradient id="emblemMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Centered Icon Group -->
  <g transform="translate(20, 10)">
    <!-- Semi-Circular Cogwheel / Gear Arch (Top 180 Degrees) -->
    <path d="
      M 30,100 L 56,100 
      A 44,44 0 0,1 144,100 
      L 170,100 
      L 168.5,75.4 L 156.7,87.9 
      L 153.0,76.4 L 164.0,71.5 
      L 155.2,56.9 L 145.7,64.3 
      L 137.3,55.6 L 145.0,46.4 
      L 130.7,37.1 L 125.4,47.9 
      L 112.1,43.3 L 114.6,31.5 
      L 100,30 
      L 85.4,31.5 L 87.9,43.3 
      L 74.6,47.9 L 69.3,37.1 
      L 55.0,46.4 L 62.7,55.6 
      L 45.7,64.3 L 36.0,71.5 
      L 47.0,76.4 L 34.3,87.9 
      L 31.5,75.4 Z" 
      fill="url(#emblemMetalGrad)" 
      stroke="#1e293b" 
      stroke-width="1.5"
    />

    <!-- THE LETTER 'K' (Bold Metallic Charcoal / Silver with Top Bevel) -->
    <path d="M 85,68 L 94,56 L 100,56 L 100,118 L 85,118 Z" fill="url(#emblemMetalGrad)"/>
    <polygon points="98,82 136,46 148,56 100,94" fill="url(#emblemMetalGrad)"/>
    <path d="M 98,88 L 132,126 L 122,134 L 95,96 Z" fill="url(#emblemMetalGrad)"/>

    <!-- Cutout Curve & Floating Circular Dot -->
    <circle cx="136" cy="120" r="5" fill="none" stroke="#080c14" stroke-width="3"/>
    <circle cx="140" cy="120" r="4.5" fill="url(#emblemMetalGrad)"/>

    <!-- THE LETTER 'J' (Vibrant Royal Blue Hook connecting to bottom of K) -->
    <path d="
      M 100,116 
      L 100,126 
      C 100,138 89,146 76,146 
      C 63,146 54,136 54,124 
      L 54,116 
      L 70,116 
      L 70,124 
      C 70,129 73,132 76,132 
      C 80,132 84,129 84,124 
      L 84,116 Z" 
      fill="url(#emblemBlueGrad)" 
      filter="url(#emblemGlow)"
    />
  </g>

  <!-- Typography Below: TECH MOTORS / COMPANY -->
  <text x="120" y="194" text-anchor="middle" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" letter-spacing="7">
    TECH MOTORS
  </text>
  <text x="120" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" fill="#94A3B8" letter-spacing="8">
    COMPANY
  </text>
</svg>
